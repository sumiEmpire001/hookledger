[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lord-sumi-hookledger"
version = "0.1.0"
description = "Signed webhook inbox with durable bounded deliveries"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hookledger = "hookledger.__main__:main"

[tool.setuptools.packages.find]
include = ["hookledger*"]
